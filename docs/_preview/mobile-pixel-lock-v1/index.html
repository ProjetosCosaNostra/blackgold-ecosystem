<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020609">
<title>BlackGold Ecosystem — Mobile PT Pixel Lock</title>
<link rel="stylesheet" href="pixel-lock.css">
</head>
<body>
<main class="pixel-page" id="top">
  <div class="visual-wrap">
    <img
      class="approved-screen"
      src="assets/APPROVED_MOBILE_SCREEN_PT.png"
      width="735"
      height="1596"
      alt="BlackGold Ecosystem — Mobile aprovado"
      draggable="false">

    <!-- HEADER -->
    <button class="hotspot home-logo" data-nav="../../index.html" aria-label="Voltar para a página principal"></button>

    <button class="hotspot lang-pt" data-lang="pt" aria-label="Português"></button>
    <button class="hotspot lang-en" data-lang="en" aria-label="English"></button>
    <button class="hotspot lang-es" data-lang="es" aria-label="Español"></button>

    <button class="hotspot menu" id="menuHotspot" aria-label="Menu"></button>

    <!-- HERO -->
    <button class="hotspot hero-explore" data-scroll="projects" aria-label="Explorar ecossistema"></button>

    <!-- PROJECTS -->
    <button class="hotspot projects-all" data-nav="../../products.html" aria-label="Ver todos os projetos"></button>

    <button class="hotspot course" data-link="course" aria-label="BlackGold Course Translator"></button>
    <button class="hotspot book" data-link="book" aria-label="Seu Serviço Tem Preço"></button>
    <button class="hotspot price-project" data-link="price_no_ponto" aria-label="Preço no Ponto"></button>
    <button class="hotspot expansion" data-nav="../../next.html" aria-label="Expansão do Ecossistema"></button>

    <!-- PUBLISHED -->
    <button class="hotspot published-all" data-nav="../../products.html" aria-label="Ver todos os ativos"></button>

    <button class="hotspot beauty" data-link="store" aria-label="BlackGold Beauty Finds"></button>
    <button class="hotspot fitnexus" data-link="fitnexus" aria-label="FitNexus Coach"></button>
    <button class="hotspot appevidex" data-link="appevidex" aria-label="AppEvidex"></button>
    <button class="hotspot playstore" data-link="price_no_ponto" aria-label="Preço no Ponto na Play Store"></button>

    <!-- COMMUNITY -->
    <button class="hotspot community-all" data-scroll="community" aria-label="Redes e comunidade"></button>

    <button class="hotspot instagram" data-link="instagram" aria-label="Instagram"></button>
    <button class="hotspot tiktok" data-link="tiktok" aria-label="TikTok"></button>
    <button class="hotspot kwai" data-link="kwai" aria-label="Kwai"></button>
    <button class="hotspot youtube" data-link="youtube" aria-label="YouTube"></button>
    <button class="hotspot facebook" data-link="facebook" aria-label="Facebook"></button>
    <button class="hotspot telegram" data-link="telegram" aria-label="Telegram"></button>

    <!-- COMPANY -->
    <button class="hotspot company-more" data-scroll="company" aria-label="Empresa e contato"></button>
    <button class="hotspot github" data-link="github" aria-label="GitHub"></button>
    <button class="hotspot linkedin" data-link="linkedin" aria-label="LinkedIn"></button>
    <button class="hotspot contact" data-link="contact" aria-label="Contato"></button>

    <!-- BOTTOM NAV -->
    <button class="hotspot bottom-home" data-scroll="top" aria-label="Início"></button>
    <button class="hotspot bottom-projects" data-scroll="projects" aria-label="Projetos"></button>
    <button class="hotspot bottom-assets" data-scroll="published" aria-label="Ativos"></button>
    <button class="hotspot bottom-networks" data-scroll="community" aria-label="Redes"></button>

    <!-- Invisible anchor positions matching approved image -->
    <span class="anchor anchor-projects" id="projects"></span>
    <span class="anchor anchor-published" id="published"></span>
    <span class="anchor anchor-community" id="community"></span>
    <span class="anchor anchor-company" id="company"></span>
  </div>
</main>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-card">
    <button data-nav="../../index.html">Destaque</button>
    <button data-nav="../../news.html">Novidades</button>
    <button data-nav="../../products.html">Produtos</button>
    <button data-nav="../../next.html">Próximos</button>
    <button data-nav="../../ecosystem.html">Ecossistema</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="pixel-lock.js"></script>
</body>
</html>
